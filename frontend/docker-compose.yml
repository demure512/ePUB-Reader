version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: ebook-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: ebook_library
      MYSQL_USER: ebook_user
      MYSQL_PASSWORD: ebook_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/init-sync-tables.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ebook-network
    command: --default-authentication-plugin=mysql_native_password

  # Spring Boot后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebook-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ebook_library?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ebook_user
      SPRING_DATASOURCE_PASSWORD: ebook_password_123
    volumes:
      - uploads_data:/opt/ebook-library/uploads
      - logs_data:/opt/ebook-library/logs
    depends_on:
      - mysql
    networks:
      - ebook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: ebook-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - ebook-network

volumes:
  mysql_data:
  uploads_data:
  logs_data:

networks:
  ebook-network:
    driver: bridge