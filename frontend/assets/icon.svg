<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 书本背景 -->
  <rect x="20" y="20" width="88" height="88" rx="4" ry="4" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  
  <!-- 书页 -->
  <rect x="24" y="24" width="80" height="80" rx="2" ry="2" fill="#ecf0f1"/>
  
  <!-- 书脊线 -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#34495e" stroke-width="2"/>
  
  <!-- 文字线条 -->
  <line x1="30" y1="35" x2="58" y2="35" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="30" y1="42" x2="58" y2="42" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="30" y1="49" x2="58" y2="49" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="30" y1="56" x2="58" y2="56" stroke="#7f8c8d" stroke-width="1.5"/>
  
  <line x1="70" y1="35" x2="98" y2="35" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="70" y1="42" x2="98" y2="42" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="70" y1="49" x2="98" y2="49" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="70" y1="56" x2="98" y2="56" stroke="#7f8c8d" stroke-width="1.5"/>
  
  <!-- 中文"一本"字样 -->
  <text x="64" y="85" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">一本</text>
</svg>