server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ebook_library?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}
      
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

jwt:
  secret: ebookLibrarySecretKey
  expiration: 86400000

logging:
  level:
    com.ebook: DEBUG
    org.springframework.security: DEBUG

app:
  upload:
    dir: uploads